<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mochi</title>
    <style>
      /* Mochi's room: a dark room with one warm light on Mochi, and its things on shelves beside it. */
      :root {
        color-scheme: dark;
        --night: #161312; --wall: #1E1B19; --shelf: #26221F; --raised: #2F2A26; --edge: rgba(255, 236, 222, 0.07);
        --fg: #F3EEE9; --dim: #B4AAA2; --faint: #857A72; --clay: #D97757; --clay-hi: #EE9773; --gold: #F2B84B;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--night); color: var(--fg); }
      body { font: 13px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-user-select: none; overflow: hidden; }
      ::selection { background: rgba(217, 119, 87, 0.45); }
      button { font: inherit; color: inherit; }
      button:focus-visible { outline: 2px solid var(--clay-hi); outline-offset: 2px; }
      .room { display: grid; grid-template-columns: 340px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: 100%; }

      /* The stage: a spotlight from above, a floor that catches it, Mochi standing in it. */
      .stage { position: relative; display: flex; flex-direction: column; align-items: center; padding: 26px 26px 22px; background: var(--night); overflow: hidden; border-right: 1px solid var(--edge); }
      .stage::before { content: ""; position: absolute; inset: -40px 0 auto; height: 420px; background: radial-gradient(ellipse 46% 62% at 50% 0%, rgba(255, 198, 158, 0.26), rgba(255, 170, 120, 0.08) 55%, transparent 75%); pointer-events: none; }
      .stage::after { content: ""; position: absolute; left: 50%; top: 222px; width: 260px; height: 50px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(ellipse at center, rgba(255, 190, 150, 0.16), transparent 70%); pointer-events: none; }
      .mochi { position: relative; z-index: 1; width: 230px; height: 230px; margin-top: 18px; filter: drop-shadow(0 18px 18px rgba(0, 0, 0, 0.55)); }
      .mochi svg { display: block; width: 100%; height: 100%; }
      .trying { position: relative; z-index: 1; height: 18px; margin: 6px 0 0; color: var(--clay-hi); font-size: 12px; font-weight: 600; }
      .plate { position: relative; z-index: 1; width: 100%; margin-top: 18px; }
      .plate h1 { margin: 0; font-size: 30px; line-height: 1.05; font-weight: 750; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
      .plate p { margin: 6px 0 0; color: var(--dim); font-size: 12.5px; font-variant-numeric: tabular-nums; }
      .xp { height: 8px; margin-top: 12px; border-radius: 4px; background: rgba(255, 255, 255, 0.07); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5); }
      .xp i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--clay), var(--gold)); }
      .facts { position: relative; z-index: 1; display: flex; width: 100%; margin: 20px 0 0; padding: 14px 0 0; border-top: 1px solid var(--edge); }
      .facts div { flex: 1; }
      .facts dt { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .facts dd { margin: 0; color: var(--faint); font-size: 11.5px; }
      .won { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 6px; width: 100%; margin-top: 16px; }
      .won span { width: 24px; height: 24px; }
      .won svg { display: block; width: 100%; height: 100%; }
      .card { position: relative; z-index: 1; margin-top: auto; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border: 1px solid var(--edge); border-radius: 10px; background: var(--shelf); cursor: pointer; transition: background 160ms ease-out, border-color 160ms ease-out; }
      .card:hover { background: var(--raised); border-color: rgba(217, 119, 87, 0.45); }
      .card svg { width: 16px; height: 16px; }
      .said { position: relative; z-index: 1; min-height: 16px; margin-top: 8px; color: var(--dim); font-size: 11.5px; text-align: center; }

      /* The shelves. */
      .things { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--wall); }
      .tabs { display: flex; gap: 22px; padding: 18px 26px 0; border-bottom: 1px solid var(--edge); }
      .tabs button { position: relative; padding: 0 0 12px; border: 0; background: none; color: var(--faint); font-size: 14px; font-weight: 650; cursor: pointer; }
      .tabs button[aria-selected="true"] { color: var(--fg); }
      .tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--clay); }
      .tabs small { margin-left: 6px; color: var(--faint); font-weight: 500; font-variant-numeric: tabular-nums; }
      .panel { flex: 1; overflow-y: auto; padding: 18px 26px 26px; scrollbar-width: thin; scrollbar-color: #4a423c transparent; }

      .slots { display: flex; flex-wrap: wrap; gap: 6px; }
      .slots button { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px 0 8px; border: 1px solid var(--edge); border-radius: 17px; background: var(--shelf); color: var(--dim); cursor: pointer; transition: background 140ms ease-out, color 140ms ease-out; }
      .slots button:hover { color: var(--fg); background: var(--raised); }
      .slots button[aria-pressed="true"] { background: var(--raised); color: var(--fg); border-color: rgba(217, 119, 87, 0.55); }
      .slots .on { display: inline-block; width: 28px; height: 20px; }
      .slots .none { display: inline-block; width: 6px; height: 6px; margin: 0 4px; border-radius: 50%; background: var(--faint); }
      .slots small { color: var(--faint); font-variant-numeric: tabular-nums; }
      .ways { display: flex; align-items: center; gap: 8px; margin: 16px 0 12px; color: var(--faint); font-size: 12px; }
      .ways button { height: 26px; padding: 0 11px; border: 1px solid var(--edge); border-radius: 8px; background: none; color: var(--dim); cursor: pointer; }
      .ways button:hover { color: var(--fg); border-color: rgba(255, 236, 222, 0.18); }
      .ways button[aria-pressed="true"] { color: var(--fg); background: var(--raised); border-color: rgba(217, 119, 87, 0.55); }
      .ways span { margin-left: auto; }

      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
      .item { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px 10px; border: 1px solid var(--edge); border-radius: 14px; background: linear-gradient(180deg, var(--raised), var(--shelf)); cursor: pointer; text-align: center; transition: transform 160ms cubic-bezier(0.2, 0.9, 0.3, 1), border-color 160ms ease-out, box-shadow 160ms ease-out; }
      .item .pic { width: 72px; height: 50px; }
      .item .pic svg { display: block; width: 100%; height: 100%; }
      .item b { font-size: 12px; font-weight: 600; line-height: 1.2; }
      .item:hover:not(:disabled) { transform: translateY(-2px); border-color: rgba(255, 236, 222, 0.2); box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35); }
      .item[aria-pressed="true"] { border-color: var(--clay); box-shadow: 0 0 0 1px var(--clay), 0 8px 18px rgba(0, 0, 0, 0.4); }
      .item .tick { position: absolute; top: 7px; right: 7px; width: 18px; height: 18px; border-radius: 50%; background: var(--clay); display: none; }
      .item[aria-pressed="true"] .tick { display: block; }
      .item .tick svg { width: 18px; height: 18px; }
      .item:disabled { cursor: default; background: var(--shelf); }
      .item:disabled b { color: var(--faint); }
      .item small { color: var(--faint); font-size: 10.5px; line-height: 1.25; }

      .medals { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
      .medal { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--edge); border-radius: 14px; background: var(--shelf); }
      .medal .pic { flex: none; width: 40px; height: 40px; }
      .medal b { display: block; font-size: 13px; }
      .medal span { display: block; color: var(--faint); font-size: 11.5px; line-height: 1.3; }
      .medal.won { background: linear-gradient(180deg, var(--raised), var(--shelf)); }
      .medal:not(.won) b { color: var(--dim); }

      .city { border-radius: 14px; overflow: hidden; border: 1px solid var(--edge); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35); }
      .city svg { display: block; width: 100%; height: auto; }
      .caption { margin: 12px 2px 0; color: var(--dim); font-size: 12.5px; }

      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
  </head>
  <body>
    <main class="room">
      <section class="stage">
        <div class="mochi" id="mochi" role="img"></div>
        <p class="trying" id="trying" aria-live="polite"></p>
        <div class="plate">
          <h1 id="level"></h1>
          <div class="xp"><i id="xp"></i></div>
          <p id="next"></p>
        </div>
        <dl class="facts" id="facts"></dl>
        <div class="won" id="won"></div>
        <button class="card" id="card" type="button"></button>
        <p class="said" id="said" aria-live="polite"></p>
      </section>
      <section class="things">
        <nav class="tabs" id="tabs" role="tablist"></nav>
        <div class="panel" id="panel" role="tabpanel"></div>
      </section>
    </main>
    <script type="module" src="/src/room.ts"></script>
  </body>
</html>
