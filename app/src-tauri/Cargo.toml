[package]
name = "mochi-desktop"
version = "0.1.0"
description = "Mochi Buddy on the desktop: every chat as a small Mochi, outside Claude Code"
edition = "2021"
license = "MIT"

[lib]
name = "mochi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde_json = "1"
