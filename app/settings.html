<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mochi</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #1F1E1D; --group: #2B2A28; --fg: #F0EFEC; --dim: #A1A09B; --line: rgba(255, 255, 255, 0.08); --accent: #E08A6A; --track: #4A4946;
      }
      @media (prefers-color-scheme: light) {
        :root { --bg: #F3F2EE; --group: #FFFFFF; --fg: #1F1E1D; --dim: #73726C; --line: rgba(0, 0, 0, 0.08); --track: #D9D8D3; }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--fg); }
      body { font: 13px/1.4 ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; padding: 18px 18px 14px; user-select: none; -webkit-user-select: none; }
      header { display: flex; align-items: center; gap: 12px; margin: 0 2px 16px; }
      header img { width: 40px; height: 40px; }
      header h1 { margin: 0; font-size: 16px; font-weight: 700; }
      header p { margin: 1px 0 0; color: var(--dim); font-size: 12px; }
      h2 { margin: 16px 4px 6px; font-size: 11px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); }
      .group { background: var(--group); border-radius: 11px; box-shadow: inset 0 0 0 1px var(--line); }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 42px; padding: 8px 12px; }
      .row + .row { border-top: 1px solid var(--line); }
      .row label { flex: 1; }
      .row small { display: block; color: var(--dim); font-size: 12px; margin-top: 1px; }

      /* A switch: a checkbox drawn as a track and a knob. */
      .switch { appearance: none; -webkit-appearance: none; position: relative; flex: none; width: 34px; height: 20px; margin: 0; border-radius: 10px; background: var(--track); cursor: pointer; transition: background 0.15s; }
      .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); transition: transform 0.15s; }
      .switch:checked { background: var(--accent); }
      .switch:checked::after { transform: translateX(14px); }
      .switch:focus-visible, .seg button:focus-visible, select:focus-visible, .button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* A segmented choice. */
      .seg { display: flex; padding: 2px; border-radius: 8px; background: var(--track); }
      .seg button { border: 0; padding: 4px 10px; border-radius: 6px; background: none; color: var(--fg); font: inherit; font-size: 12px; cursor: pointer; }
      .seg button[aria-pressed="true"] { background: var(--group); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); font-weight: 650; }

      select { font: inherit; padding: 4px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
      .button { flex: none; border: 1px solid var(--line); padding: 5px 12px; border-radius: 7px; background: var(--bg); color: var(--fg); font: inherit; cursor: pointer; }
      .button:hover { filter: brightness(1.08); }
      @media (prefers-reduced-motion: reduce) { .switch, .switch::after { transition: none; } }
    </style>
  </head>
  <body>
    <header>
      <img src="/mochi.png" alt="" />
      <div><h1 id="title"></h1><p id="version"></p></div>
    </header>

    <h2 id="h-look"></h2>
    <div class="group">
      <div class="row"><span id="l-size"></span><div class="seg" id="size" role="group"></div></div>
      <div class="row"><label for="onTop" id="l-onTop"></label><input type="checkbox" class="switch" id="onTop" /></div>
      <div class="row"><label for="showAgents" id="l-showAgents"></label><input type="checkbox" class="switch" id="showAgents" /></div>
      <div class="row"><span id="l-idle"></span><div class="seg" id="idleMinutes" role="group"></div></div>
    </div>

    <h2 id="h-talk"></h2>
    <div class="group">
      <div class="row"><label for="talk-asking" id="l-talk-asking"></label><input type="checkbox" class="switch" id="talk-asking" /></div>
      <div class="row"><label for="talk-done" id="l-talk-done"></label><input type="checkbox" class="switch" id="talk-done" /></div>
      <div class="row"><label for="talk-failed" id="l-talk-failed"></label><input type="checkbox" class="switch" id="talk-failed" /></div>
      <div class="row"><label for="talk-limit" id="l-talk-limit"></label><input type="checkbox" class="switch" id="talk-limit" /></div>
      <div class="row"><span id="l-talkSeconds"></span><div class="seg" id="talkSeconds" role="group"></div></div>
      <div class="row"><label for="sound" id="l-sound"></label><input type="checkbox" class="switch" id="sound" /></div>
    </div>

    <h2 id="h-language"></h2>
    <div class="group">
      <div class="row"><label for="lang" id="l-lang"></label><select id="lang"></select></div>
    </div>

    <h2 id="h-agents"></h2>
    <div class="group">
      <div class="row"><div><label for="approve" id="l-approve"></label><small id="approveHint"></small></div><input type="checkbox" class="switch" id="approve" /></div>
      <div class="row"><div><span id="l-claude"></span><small id="claudeState"></small></div><button class="button" id="claude" type="button"></button></div>
      <div class="row"><div><span id="l-codex"></span><small id="codexState"></small></div><button class="button" id="codex" type="button"></button></div>
    </div>

    <h2 id="h-startup"></h2>
    <div class="group">
      <div class="row"><label for="atLogin" id="l-atLogin"></label><input type="checkbox" class="switch" id="atLogin" /></div>
      <div class="row"><span id="l-place"></span><button class="button" id="resetPlace" type="button"></button></div>
    </div>

    <script type="module" src="/src/settings-page.ts"></script>
  </body>
</html>
