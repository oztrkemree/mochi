<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mochi</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; cursor: default; }
      /* Mochi stands in the window's bottom right corner; what it says sits above it and the window grows to hold it. */
      #stage { position: absolute; right: 0; bottom: 0; width: 128px; height: 128px; }
      #stage > svg { display: block; width: 100%; height: 100%; }
      /* As wide as the widest thing Mochi says, whatever the window's width is now, so a line can be measured before the window grows. */
      #talk { position: absolute; right: 0; bottom: 130px; width: 264px; display: flex; justify-content: flex-end; }
      /* The band's own bubble: a dark pill, a dot in the news's ink, the words in its weight. */
      #say {
        display: none; position: relative; max-width: 240px; margin-right: 18px; padding: 7px 12px 7px 24px; border-radius: 13px; white-space: pre-line;
        font: 650 12.5px/1.4 ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
        background: #2B2A28; color: #F0EFEC; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), 0 2px 10px rgba(0, 0, 0, 0.25);
      }
      #say::before { content: ""; position: absolute; left: 11px; top: 13px; width: 7px; height: 7px; border-radius: 50%; background: var(--ink, #6E6D69); }
      /* The tail points down at Mochi. */
      #say::after { content: ""; position: absolute; right: 26px; bottom: -6px; width: 12px; height: 12px; background: #2B2A28; transform: rotate(45deg); border-radius: 0 0 3px 0; box-shadow: 1px 1px 0 rgba(255, 255, 255, 0.08); }
      #say.on { display: block; }
      @media (prefers-color-scheme: light) {
        #say, #say::after { background: #FAF9F5; }
        #say { color: #1F1E1D; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.1), 0 2px 10px rgba(0, 0, 0, 0.12); }
      }
    </style>
  </head>
  <body>
    <div id="talk"><div id="say" role="status"></div></div>
    <div id="stage" role="img"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
