<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mochi</title>
    <style>
      :root { --size: 128px; --card: #2B2A28; --fg: #F0EFEC; --dim: #A1A09B; --line: rgba(255, 255, 255, 0.08); }
      @media (prefers-color-scheme: light) { :root { --card: #FAF9F5; --fg: #1F1E1D; --dim: #73726C; --line: rgba(0, 0, 0, 0.1); } }
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; cursor: default; }
      body { font: 500 12.5px/1.4 ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; color: var(--fg); }
      /* Everything stands in the window's bottom right corner; the window is sized to it. */
      #root { position: absolute; right: 0; bottom: 0; width: max-content; display: flex; flex-direction: column; align-items: flex-end; }
      #row { position: relative; display: flex; align-items: flex-end; }
      /* Mochi's own square is --size; the drawing has room around it for what it holds (see ROOM in world.ts). */
      #stage { width: calc(var(--size) * 1.48); height: calc(var(--size) * 1.2); }
      #stage > svg { display: block; width: 100%; height: 100%; }

      .card { background: var(--card); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line), 0 4px 14px rgba(0, 0, 0, 0.22); }

      /* The band's own bubble: a dark pill, a dot in the news's ink, a tail down to Mochi. */
      #say { display: none; position: relative; z-index: 2; max-width: 240px; margin: 0 calc(var(--size) * 0.3) calc(var(--size) * -0.16) 0; padding: 7px 12px 7px 24px; border-radius: 13px; white-space: pre-line; font-weight: 650; }
      #say::before { content: ""; position: absolute; left: 11px; top: 13px; width: 7px; height: 7px; border-radius: 50%; background: var(--ink, #6E6D69); }
      #say::after { content: ""; position: absolute; right: 22px; bottom: -6px; width: 12px; height: 12px; background: var(--card); transform: rotate(45deg); border-radius: 0 0 3px 0; box-shadow: 1px 1px 0 var(--line); }
      #say.on { display: block; }

      /* Each chat a dot on the ground by Mochi's feet, just right of its shadow (the ground things stand on its left): the shadow lies at 90.5 of Mochi's square and ends at 75, see SHADOW and ROOM in world.ts. No card: they are part of the scene. */
      #agents { position: absolute; left: calc(var(--size) * 1.03); bottom: calc(var(--size) * 0.155 - 3.5px); display: flex; align-items: center; gap: 4px; padding: 6px; margin: -6px; border: 0; border-radius: 10px; background: none; font: inherit; cursor: pointer; z-index: 1; }
      #agents:hover { background: rgba(127, 127, 127, 0.16); }
      #agents:focus-visible { outline: 2px solid #E08A6A; outline-offset: 0; }
      #agents .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35); }
      /* A chat that waits for the person glows softly, the only thing that moves here. */
      #agents .dot.asking { animation: glow 1.6s ease-in-out infinite; }
      @keyframes glow { 50% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 35%, transparent), 0 1px 2px rgba(0, 0, 0, 0.35); } }
      #agents .more { font-size: 10.5px; font-weight: 650; color: #F0EFEC; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); }
      #agents.empty, #agents[hidden] { display: none; }
      @media (prefers-reduced-motion: reduce) { #agents .dot.asking { animation: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--ink) 40%, transparent); } }

      /* The list of agents, over Mochi. */
      /* Close over Mochi's head, into the empty room the drawing keeps above it. */
      #list { display: none; position: relative; z-index: 2; width: 290px; max-height: 330px; overflow-y: auto; margin: 0 0 calc(var(--size) * -0.2) 0; padding: 6px; border-radius: 14px; }
      #list.on { display: block; }
      #list h2 { margin: 4px 8px 6px; font-size: 11px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); }
      #list .empty { margin: 6px 8px 8px; color: var(--dim); }
      .agent { display: grid; grid-template-columns: 10px 1fr; column-gap: 8px; align-items: baseline; width: 100%; padding: 6px 8px; border: 0; border-radius: 9px; background: none; color: inherit; font: inherit; text-align: left; }
      .agent[data-link] { cursor: pointer; }
      .agent[data-link]:hover, .agent[data-link]:focus-visible { background: var(--line); outline: none; }
      .agent .dot { width: 8px; height: 8px; border-radius: 50%; transform: translateY(-1px); }
      .agent .name { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .agent .line, .agent .sub { grid-column: 2; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .agent .sub::before { content: "↳ "; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="list" class="card" role="dialog"></div>
      <div id="say" class="card" role="status"></div>
      <div id="row">
        <button id="agents" type="button"></button>
        <div id="stage" role="img"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
