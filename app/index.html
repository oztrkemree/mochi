<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mochi</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; cursor: default; }
      /* Mochi stands in the window's bottom right corner; what it says sits above it and the window grows to hold it. */
      #stage { position: absolute; right: 0; bottom: 0; width: 128px; height: 128px; }
      #stage > svg { display: block; width: 100%; height: 100%; }
      /* As wide as the widest thing Mochi says, whatever the window's width is now, so a line can be measured before the window grows. */
      #talk { position: absolute; right: 0; bottom: 124px; width: 264px; display: flex; justify-content: flex-end; }
      #say {
        display: none; max-width: 240px; margin-right: 10px; padding: 8px 12px; border-radius: 14px 14px 4px 14px; white-space: pre-line;
        font: 500 13px/1.35 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: rgba(38, 38, 36, 0.97); color: #F0EFEC; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.09);
      }
      #say.on { display: block; }
      @media (prefers-color-scheme: light) {
        #say { background: rgba(250, 249, 245, 0.98); color: #1F1E1D; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.1); }
      }
    </style>
  </head>
  <body>
    <div id="talk"><div id="say" role="status"></div></div>
    <div id="stage" role="img"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
