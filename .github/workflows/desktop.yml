# The desktop app: built for macOS (Apple silicon and Intel) and Windows, put
# on a release named for its version, and its update file copied to the
# release the installed apps look at (desktop-latest).
#
# To release: set the version in app/src-tauri/tauri.conf.json, app/package.json
# and app/src-tauri/Cargo.toml, merge, then push a tag desktop-vX.Y.Z on that
# commit. The release is made as a draft, to be published by hand.
name: desktop

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # One at a time: each job adds its computer to the one latest.json on the release.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      # Without the signing key the installers are built all the same; they just do not update themselves.
      HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm test
        working-directory: app
      - run: cargo test --target ${{ matrix.target }}
        if: matrix.target != 'x86_64-apple-darwin'
        working-directory: app/src-tauri
      - name: Sign the update files, with the key there
        if: env.HAS_KEY == 'true'
        working-directory: app/src-tauri
        run: node -e "const f='tauri.conf.json',c=JSON.parse(require('fs').readFileSync(f));c.bundle.createUpdaterArtifacts=true;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: desktop-v__VERSION__
          releaseName: 'Mochi Buddy desktop __VERSION__'
          releaseBody: 'Mochi on the desktop. See app/README.md for what it does and how to install it.'
          # A draft: the person looks at it and publishes it.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  # The mod's own releases stay the repository's latest; the installed apps look for desktop-latest/latest.json.
  point:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          # A draft's files are not public yet: installed apps are pointed at them once it is published (run this again then).
          if [ "$(gh release view "desktop-v$version" --json isDraft --jq .isDraft)" = "true" ]; then
            echo "desktop-v$version is a draft: publish it, then run this workflow again to point installed apps at it."
            exit 0
          fi
          gh release edit "desktop-v$version" --latest=false
          mod=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName,createdAt --jq '[.[] | select(.tagName | test("^v[0-9]"))] | sort_by(.createdAt) | last | .tagName // empty')
          if [ -n "$mod" ]; then gh release edit "$mod" --latest; fi
          if ! gh release download "desktop-v$version" --pattern latest.json --dir out; then
            echo "No latest.json: built without the signing key, so installed apps are not pointed at this release."
            exit 0
          fi
          gh release view desktop-latest >/dev/null 2>&1 || gh release create desktop-latest --title 'Mochi Buddy desktop: update file' --notes 'Where installed apps look for a new version. Not an install: see the desktop-v releases.' --latest=false
          gh release upload desktop-latest out/latest.json --clobber
